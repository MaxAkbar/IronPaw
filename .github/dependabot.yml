version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*']
      mstest:
        patterns: ['MSTest.*', 'Microsoft.Testing.*', 'Microsoft.NET.Test.Sdk', 'Microsoft.TestPlatform.*']
    ignore:
      - dependency-name: CSharpDB.Engine
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
